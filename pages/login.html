<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login – StudyBuddy</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="auth-container">
    <div class="auth-logo">
        <div class="logo-text">📚 StudyBuddy</div>
        <div class="logo-sub">Deine Lernpartner-Plattform</div>
    </div>

    <div class="card">
        <h1>Einloggen</h1>

        <form id="loginForm" class="form-group">
            <label for="email">E-Mail</label>
            <input type="email" id="email" placeholder="name@schule.ch" autocomplete="email">
            <label for="password">Passwort</label>
            <input type="password" id="password" placeholder="Passwort" autocomplete="current-password">
            <button type="submit">Einloggen</button>
        </form>

        <div id="message"></div>
    </div>

    <p class="auth-link">Noch kein Konto? <a href="register.html">Jetzt registrieren</a></p>
</main>

<script src="../js/auth.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
