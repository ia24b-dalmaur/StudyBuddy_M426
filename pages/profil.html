<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Lernprofil</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container">
    <h1>Lernprofil erstellen</h1>

    <form id="profileForm">
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="klasse" placeholder="Klasse">
        <input type="text" id="faecher" placeholder="Fächer, z.B. Mathe, Englisch">
        <input type="text" id="interessen" placeholder="Interessen, z.B. Programmieren">
        <button type="submit">Profil speichern</button>
    </form>

    <p id="message"></p>

    <section id="profileOutput"></section>

    <a href="matching.html">Lernpartner anzeigen</a>
</main>

<script src="../js/profil.js"></script>
</body>
</html>
