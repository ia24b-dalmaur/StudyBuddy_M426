<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profil – StudyBuddy</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav id="mainNav"></nav>
<main class="container">
    <div class="page-header">
        <div class="eyebrow">Mein Account</div>
        <h1>Lernprofil</h1>
        <p>Gib deine Fächer und Zeiten an, damit wir passende Partner finden.</p>
    </div>

    <div class="card">
        <div class="form-group">
            <div class="field">
                <label for="name">Vollständiger Name</label>
                <input type="text" id="name" placeholder="z.B. Max Mustermann">
            </div>
            <div class="field">
                <label for="klasse">Klasse / Gruppe</label>
                <input type="text" id="klasse" placeholder="z.B. IA24b">
            </div>

            <div class="field">
                <label>Fächer <span style="color:var(--text-muted);font-weight:400">— klicke zum Auswählen</span></label>
                <div id="faecherGrid" class="tag-selector-grid"></div>
                <div class="custom-input-row">
                    <input type="text" id="faecherInput" placeholder="Eigenes Fach hinzufügen...">
                    <button id="faecherAddBtn" class="btn btn-ghost btn-sm">
                        <i data-lucide="plus" style="width:14px;height:14px"></i>
                    </button>
                </div>
            </div>

            <div class="field">
                <label>Interessen <span style="color:var(--text-muted);font-weight:400">— klicke zum Auswählen</span></label>
                <div id="interessenGrid" class="tag-selector-grid"></div>
                <div class="custom-input-row">
                    <input type="text" id="interessenInput" placeholder="Eigenes Interesse hinzufügen...">
                    <button id="interessenAddBtn" class="btn btn-ghost btn-sm">
                        <i data-lucide="plus" style="width:14px;height:14px"></i>
                    </button>
                </div>
            </div>

            <div class="field">
                <label>Wann lernst du am liebsten?</label>
                <div id="zeitGrid" class="zeit-grid"></div>
            </div>

            <button id="saveBtn" class="btn-full">
                <i data-lucide="save"></i>
                Profil speichern
            </button>
        </div>
        <div id="profileMessage"></div>
    </div>

    <div id="profileOutput"></div>
</main>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../js/auth.js"></script>
<script>renderNav();</script>
<script src="../js/profil.js"></script>
</body>
</html>
