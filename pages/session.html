<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sessions – StudyBuddy</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav id="mainNav"></nav>
<main class="container">
    <div class="page-header">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <div>
                <div class="eyebrow">Lernsessions</div>
                <h1>Sessions</h1>
                <p>Finde laufende oder geplante Lernsessions.</p>
            </div>
            <button id="openCreateBtn">
                <i data-lucide="plus" style="width:15px;height:15px"></i>
                Session erstellen
            </button>
        </div>
    </div>

    <div class="card" id="createCard" style="display:none">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <h2 style="display:flex;align-items:center;gap:8px;margin:0">
                <i data-lucide="plus-circle" style="width:18px;height:18px;color:var(--indigo-light)"></i>
                Neue Session
            </h2>
            <button class="btn btn-ghost btn-sm" onclick="closeCreateForm()" style="padding:6px 8px">
                <i data-lucide="x" style="width:15px;height:15px"></i>
            </button>
        </div>
        <div class="form-group">
            <div class="field">
                <label for="sessionFach">Fach</label>
                <input type="text" id="sessionFach" placeholder="z.B. Mathematik">
            </div>
            <div class="field">
                <label for="sessionThema">Thema / Beschreibung</label>
                <input type="text" id="sessionThema" placeholder="z.B. Analysis – Ableitungen üben">
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <div class="field">
                    <label for="sessionDatum">Datum</label>
                    <input type="date" id="sessionDatum">
                </div>
                <div class="field">
                    <label for="sessionZeit">Uhrzeit</label>
                    <input type="time" id="sessionZeit">
                </div>
            </div>
            <button type="button" class="btn btn-ghost btn-sm" onclick="setJetzt()" style="align-self:flex-start">
                <i data-lucide="zap" style="width:13px;height:13px"></i>
                Jetzt starten
            </button>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <div class="field">
                    <label>Dauer (Minuten)</label>
                    <div class="number-input-wrap">
                        <button type="button" class="number-btn" onclick="changeVal('sessionDauer', -15)">
                            <i data-lucide="minus" style="width:13px;height:13px"></i>
                        </button>
                        <input type="number" id="sessionDauer" value="60" min="15" max="480">
                        <button type="button" class="number-btn" onclick="changeVal('sessionDauer', 15)">
                            <i data-lucide="plus" style="width:13px;height:13px"></i>
                        </button>
                    </div>
                </div>
                <div class="field">
                    <label>Max. Teilnehmer</label>
                    <div class="number-input-wrap">
                        <button type="button" class="number-btn" onclick="changeVal('sessionMax', -1)">
                            <i data-lucide="minus" style="width:13px;height:13px"></i>
                        </button>
                        <input type="number" id="sessionMax" value="5" min="1" max="20">
                        <button type="button" class="number-btn" onclick="changeVal('sessionMax', 1)">
                            <i data-lucide="plus" style="width:13px;height:13px"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="field">
                <label>Format</label>
                <div class="toggle-row">
                    <button type="button" class="toggle-btn active" id="vorOrtBtn" onclick="setFormat('vor-ort')">
                        <i data-lucide="map-pin" style="width:14px;height:14px"></i> Vor Ort
                    </button>
                    <button type="button" class="toggle-btn" id="onlineBtn" onclick="setFormat('online')">
                        <i data-lucide="video" style="width:14px;height:14px"></i> Online
                    </button>
                </div>
            </div>
            <div class="field" id="linkField" style="display:none">
                <label for="sessionLink">Meeting-Link (Teams / Zoom)</label>
                <input type="text" id="sessionLink" placeholder="https://teams.microsoft.com/...">
            </div>

            <button id="createBtn" class="btn-full">
                <i data-lucide="play-circle" style="width:15px;height:15px"></i>
                Session erstellen
            </button>
        </div>
        <div id="createMsg"></div>
    </div>

    <div id="mySessionWrap" style="display:none">
        <div class="section-label" style="margin-bottom:10px">Meine Session</div>
        <div id="mySession"></div>
    </div>

    <div id="einladungenWrap" style="display:none">
        <div class="section-label" style="margin:20px 0 10px">
            <i data-lucide="mail" style="width:12px;height:12px"></i>
            Einladungen von Freunden
        </div>
        <div id="einladungenList"></div>
    </div>

    <div class="section-label" style="margin:20px 0 10px">
        <i data-lucide="calendar" style="width:12px;height:12px"></i>
        Sessions
        <button onclick="loadSessions()" class="btn btn-ghost btn-sm" style="margin-left:auto;padding:4px 10px;font-size:12px">
            <i data-lucide="refresh-cw" style="width:12px;height:12px"></i>
            Aktualisieren
        </button>
    </div>
    <div id="sessionList"></div>
</main>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../js/auth.js"></script>
<script>renderNav();</script>
<script src="../js/session.js"></script>
</body>
</html>
