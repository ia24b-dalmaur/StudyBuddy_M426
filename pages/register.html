<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrieren – StudyBuddy</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="auth-container">
    <div class="auth-logo">
        <div class="logo-text">📚 StudyBuddy</div>
        <div class="logo-sub">Deine Lernpartner-Plattform</div>
    </div>

    <div class="card">
        <h1>Konto erstellen</h1>

        <div class="form-group">
            <label for="email">E-Mail</label>
            <input type="email" id="email" placeholder="name@schule.ch" autocomplete="email">
            <label for="password">Passwort</label>
            <input type="password" id="password" placeholder="Mindestens 4 Zeichen" autocomplete="new-password">
            <button type="submit" id="registerBtn" onclick="doRegister()">Konto erstellen</button>
        </div>

        <div id="message"></div>
    </div>

    <p class="auth-link">Bereits registriert? <a href="login.html">Einloggen</a></p>
</main>

<script src="../js/auth.js"></script>
<script src="../js/register.js"></script>
</body>
</html>
