<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrieren – StudyBuddy</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-input-wrap { position: relative; }
        .input-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; display:flex; align-items:center; }
        .input-icon svg { width:15px; height:15px; }
        .auth-input-wrap input { padding-left: 38px; }
        .pw-strength { height: 3px; border-radius: 2px; margin-top: 6px; background: var(--border); overflow: hidden; }
        .pw-strength-fill { height: 100%; border-radius: 2px; transition: all 0.3s; width: 0; }
        .pw-hint { font-size: 0.73rem; color: var(--text-muted); margin-top: 4px; }
    </style>
</head>
<body>
<div class="auth-wrap">
    <div class="auth-box">
        <div class="auth-logo">
            <div class="logo-mark"><i data-lucide="book-open"></i></div>
            <span class="logo-text">StudyBuddy</span>
            <div class="logo-sub">Finde deinen perfekten Lernpartner</div>
        </div>
        <div class="auth-card">
            <div class="auth-title">Konto erstellen</div>
            <div class="form-group">
                <div class="field">
                    <label for="email">E-Mail</label>
                    <div class="auth-input-wrap">
                        <span class="input-icon"><i data-lucide="mail"></i></span>
                        <input type="email" id="email" placeholder="name@schule.ch" autocomplete="email">
                    </div>
                </div>
                <div class="field">
                    <label for="password">Passwort</label>
                    <div class="auth-input-wrap">
                        <span class="input-icon"><i data-lucide="lock"></i></span>
                        <input type="password" id="password" placeholder="Mindestens 4 Zeichen" autocomplete="new-password" oninput="checkStrength(this.value)">
                    </div>
                    <div class="pw-strength"><div class="pw-strength-fill" id="pwFill"></div></div>
                    <div class="pw-hint" id="pwHint">Passwort eingeben</div>
                </div>
                <button onclick="doRegister()" class="btn-full" id="regBtn">Konto erstellen</button>
            </div>
            <div id="message"></div>
        </div>
        <p class="auth-footer">Bereits registriert? <a href="/pages/login.html">Einloggen</a></p>
    </div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/register.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
